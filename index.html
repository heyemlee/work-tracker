<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Track every job application, from every account." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=bars-black" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=bars-black" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Outbox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Outbox</title>
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      (function () {
        var theme = 'white';
        try {
          theme = JSON.parse(localStorage.getItem('outbox.prefs.v1') || '{}').theme || 'white';
        } catch (e) {}
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
