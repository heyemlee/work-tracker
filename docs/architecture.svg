<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" width="960" height="552" role="img" aria-labelledby="title desc">
  <title id="title">Outbox architecture</title>
  <desc id="desc">The web app and the Autofill extension talk to one Cloudflare Worker, which serves the app, runs a Hono API with Better Auth, and stores data in D1. The extension asks Claude only for fields its rules can't place. A NestJS service behind Discover and Resume tools reads public job boards into PostgreSQL and parses resumes with OpenAI or Anthropic; the app reaches it through the dev server, and the deployed app through the Worker and a Cloudflare Tunnel to the computer it runs on.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #8e8e93; }
    .title { font-size: 16px; font-weight: 600; fill: #1d1d1f; }
    .name { font-size: 14px; font-weight: 600; fill: #1d1d1f; }
    .sub { font-size: 12.5px; fill: #6e6e73; }
    .edge { font-size: 11px; fill: #8e8e93; }
    .card { fill: #ffffff; stroke: #e3e3e8; stroke-width: 1; }
    .wire { fill: none; stroke: #d6d6dc; stroke-width: 1.5; }
    .pulse {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 0.14 1.3;
      stroke-dashoffset: 0.14;
      opacity: 0;
      animation: travel 8s linear infinite;
    }
    .data { stroke: #0a7cff; }
    .ai { stroke: #d97757; }
    .service { stroke: #0d9488; }
    .live { animation: breathe 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes travel {
      0% { stroke-dashoffset: 0.14; opacity: 1; }
      24% { stroke-dashoffset: -1; opacity: 1; }
      25%, 100% { stroke-dashoffset: -1; opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
      .live { animation: none; }
    }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="551" rx="16" fill="#ffffff" stroke="#ececf0" />

  <!-- The containers go under the wires, their cards over them -->
  <rect x="372" y="84" width="296" height="282" rx="18" fill="#fafafb" stroke="#e3e3e8" />

  <!-- Wires -->
  <path class="wire" d="M264,152 C330,152 326,159 392,159" />
  <path class="wire" d="M264,300 C330,300 326,175 392,175" />
  <path class="wire" d="M264,322 C330,322 326,235 392,235" />
  <path class="wire" d="M648,159 C700,159 692,238 744,238" />
  <path class="wire" d="M648,311 C700,311 692,262 744,262" />
  <path class="wire" stroke-dasharray="4 5" d="M148,100 C148,64 164,44 196,44 L700,44 C726,44 744,58 744,80" />
  <path class="wire" d="M148,362 C148,420 164,461 200,461 L372,461" />
  <path class="wire" d="M668,440 C706,440 706,422 744,422" />
  <path class="wire" d="M668,484 C706,484 706,498 744,498" />

  <text class="edge" x="318" y="124" text-anchor="middle">logs · profile</text>
  <text class="edge" x="318" y="138" text-anchor="middle">resume PDFs</text>
  <text class="edge" x="318" y="352" text-anchor="middle">same origin</text>
  <text class="edge" x="698" y="186" text-anchor="middle">SQL</text>
  <text class="edge" x="702" y="334" text-anchor="middle">sessions</text>
  <text class="edge" x="452" y="34" text-anchor="middle">only fields the rules can't place · your own key</text>
  <text class="edge" x="276" y="452" text-anchor="middle">dev server · Cloudflare Tunnel</text>

  <!-- Pulses: a log from the extension lands in D1 and comes back to the app's list; the extension asks Claude; the
       app asks the service, which reads the job boards and, on Parse, a model -->
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M264,152 C330,152 326,159 392,159" style="animation-delay: 0s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M648,159 C700,159 692,238 744,238" style="animation-delay: 1s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M744,238 C692,238 700,159 648,159" style="animation-delay: 2.2s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M392,175 C326,175 330,300 264,300" style="animation-delay: 3.2s" />
  <path class="pulse ai" pathLength="1" filter="url(#glow)" d="M148,100 C148,64 164,44 196,44 L700,44 C726,44 744,58 744,80" style="animation-delay: 4.2s" />
  <path class="pulse service" pathLength="1" filter="url(#glow)" d="M148,362 C148,420 164,461 200,461 L372,461" style="animation-delay: 5.2s" />
  <path class="pulse service" pathLength="1" filter="url(#glow)" d="M668,440 C706,440 706,422 744,422" style="animation-delay: 6.2s" />
  <path class="pulse ai" pathLength="1" filter="url(#glow)" d="M668,484 C706,484 706,498 744,498" style="animation-delay: 7s" />

  <!-- Clients -->
  <g filter="url(#lift)">
    <rect class="card" x="32" y="100" width="232" height="104" rx="14" />
    <rect class="card" x="32" y="270" width="232" height="92" rx="14" />
  </g>
  <text class="eyebrow" x="52" y="126">CHROME</text>
  <text class="title" x="52" y="150">Autofill extension</text>
  <text class="sub" x="52" y="174">MV3 · WXT · 9 ATS adapters</text>
  <text class="sub" x="52" y="192">Rules first, Claude for the rest</text>

  <text class="eyebrow" x="52" y="296">BROWSER</text>
  <text class="title" x="52" y="320">Outbox web app</text>
  <text class="sub" x="52" y="344">React 19 · TanStack Query</text>
  <!-- Outbox's pet at rest, as the icons draw it (src/assets/outbox.svg, from npm run icons). -->
  <g transform="translate(222 286) scale(0.36)">
    <g transform="translate(32 33.521) scale(0.39)">
      <path fill="#1d1d1f" d="M61.5 0C61.84 2.31 62.19 4.64 62.43 7.03C62.68 9.43 62.93 11.89 62.96 14.37C63 16.85 62.99 19.43 62.62 21.91C62.25 24.39 61.69 26.94 60.75 29.26C59.82 31.58 58.53 33.84 57.01 35.82C55.49 37.81 53.62 39.63 51.62 41.17C49.63 42.7 47.32 43.97 45.03 45.03C42.75 46.09 40.28 46.87 37.91 47.53C35.53 48.19 33.11 48.63 30.79 49C28.47 49.38 26.19 49.6 23.98 49.8C21.78 50 19.64 50.1 17.56 50.19C15.48 50.28 13.47 50.31 11.49 50.35C9.51 50.38 7.59 50.39 5.68 50.39C3.76 50.4 1.89 50.4 0 50.4C-1.89 50.4 -3.76 50.4 -5.68 50.39C-7.59 50.39 -9.51 50.38 -11.49 50.35C-13.47 50.31 -15.48 50.28 -17.56 50.19C-19.64 50.1 -21.78 50 -23.98 49.8C-26.19 49.6 -28.47 49.38 -30.79 49C-33.11 48.63 -35.53 48.19 -37.91 47.53C-40.28 46.87 -42.75 46.09 -45.03 45.03C-47.32 43.97 -49.63 42.7 -51.62 41.17C-53.62 39.63 -55.49 37.81 -57.01 35.82C-58.53 33.84 -59.82 31.58 -60.75 29.26C-61.69 26.94 -62.25 24.39 -62.62 21.91C-62.99 19.43 -63 16.85 -62.96 14.37C-62.93 11.89 -62.68 9.43 -62.43 7.03C-62.19 4.64 -61.84 2.31 -61.5 0C-61.16 -2.31 -60.84 -4.57 -60.4 -6.81C-59.96 -9.04 -59.47 -11.26 -58.84 -13.43C-58.22 -15.6 -57.45 -17.72 -56.65 -19.82C-55.85 -21.92 -54.97 -23.98 -54.03 -26.02C-53.09 -28.06 -52.13 -30.11 -50.99 -32.04C-49.86 -33.98 -48.58 -35.87 -47.2 -37.64C-45.82 -39.41 -44.3 -41.11 -42.69 -42.69C-41.08 -44.26 -39.35 -45.74 -37.55 -47.08C-35.75 -48.42 -33.84 -49.65 -31.89 -50.75C-29.94 -51.84 -27.9 -52.81 -25.84 -53.65C-23.78 -54.5 -21.66 -55.21 -19.53 -55.8C-17.4 -56.4 -15.23 -56.86 -13.06 -57.22C-10.9 -57.59 -8.71 -57.83 -6.53 -57.99C-4.36 -58.15 -2.18 -58.2 0 -58.2C2.18 -58.2 4.36 -58.15 6.53 -57.99C8.71 -57.83 10.9 -57.59 13.06 -57.22C15.23 -56.86 17.4 -56.4 19.53 -55.8C21.66 -55.21 23.78 -54.5 25.84 -53.65C27.9 -52.81 29.94 -51.84 31.89 -50.75C33.84 -49.65 35.75 -48.42 37.55 -47.08C39.35 -45.74 41.08 -44.26 42.69 -42.69C44.3 -41.11 45.82 -39.41 47.2 -37.64C48.58 -35.87 49.86 -33.98 50.99 -32.04C52.13 -30.11 53.09 -28.06 54.03 -26.02C54.97 -23.98 55.85 -21.92 56.65 -19.82C57.45 -17.72 58.22 -15.6 58.84 -13.43C59.47 -11.26 59.96 -9.04 60.4 -6.81C60.84 -4.57 61.16 -2.31 61.5 0Z" />
      <path fill="#ffffff" d="M-23.28 -11.64L-22.89 -13.86L-21.76 -15.81L-20.04 -17.25L-17.93 -18.02L-15.67 -18.02L-13.56 -17.25L-11.84 -15.81L-10.71 -13.86L-10.32 -11.64L-10.32 -1.56L-10.71 0.66L-11.84 2.61L-13.56 4.05L-15.67 4.82L-17.93 4.82L-20.04 4.05L-21.76 2.61L-22.89 0.66L-23.28 -1.56Z" />
      <path fill="#ffffff" d="M10.32 -11.64L10.71 -13.86L11.84 -15.81L13.56 -17.25L15.67 -18.02L17.93 -18.02L20.04 -17.25L21.76 -15.81L22.89 -13.86L23.28 -11.64L23.28 -1.56L22.89 0.66L21.76 2.61L20.04 4.05L17.93 4.82L15.67 4.82L13.56 4.05L11.84 2.61L10.71 0.66L10.32 -1.56Z" />
    </g>
  </g>

  <!-- The Worker -->
  <circle class="live" cx="394" cy="106" r="4.5" fill="#f38020" />
  <text class="name" x="406" y="111">Cloudflare Worker</text>
  <text class="edge" x="648" y="111" text-anchor="end">one deploy</text>
  <g filter="url(#lift)">
    <rect class="card" x="392" y="128" width="256" height="62" rx="12" />
    <rect class="card" x="392" y="204" width="256" height="62" rx="12" />
    <rect class="card" x="392" y="280" width="256" height="62" rx="12" />
  </g>
  <text class="name" x="410" y="154">Hono API · /api</text>
  <text class="sub" x="410" y="174">zod-validated, scoped per user</text>
  <text class="name" x="410" y="230">Static assets</text>
  <text class="sub" x="410" y="250">the built React app</text>
  <text class="name" x="410" y="306">Better Auth</text>
  <text class="sub" x="410" y="326">Google sign-in, allowlisted emails</text>

  <!-- Storage -->
  <g filter="url(#lift)">
    <path d="M744,200 V300 A92,13 0 0 0 928,300 V200" fill="#ffffff" stroke="#e3e3e8" />
    <ellipse cx="836" cy="200" rx="92" ry="13" fill="#fafafb" stroke="#e3e3e8" />
  </g>
  <text class="name" x="836" y="254" text-anchor="middle">D1 · SQLite</text>
  <text class="sub" x="836" y="274" text-anchor="middle">Drizzle, batched writes</text>

  <!-- The extension's model -->
  <rect class="card" x="744" y="60" width="184" height="70" rx="14" filter="url(#lift)" />
  <circle cx="764" cy="85" r="4.5" fill="#d97757" />
  <text class="name" x="776" y="90">Claude API</text>
  <text class="sub" x="764" y="113">the extension's own key</text>

  <!-- The service behind Discover and Resume tools -->
  <rect class="card" x="372" y="410" width="296" height="104" rx="14" filter="url(#lift)" />
  <circle cx="392" cy="432" r="4.5" fill="#0d9488" />
  <text class="name" x="404" y="437">NestJS service · backend/</text>
  <text class="edge" x="648" y="437" text-anchor="end">local</text>
  <text class="sub" x="392" y="460">Discover: sync, search, save</text>
  <text class="sub" x="392" y="479">Resume tools: parse, evals</text>
  <text class="sub" x="392" y="498">PostgreSQL · Prisma</text>

  <g filter="url(#lift)">
    <rect class="card" x="744" y="392" width="184" height="60" rx="14" />
    <rect class="card" x="744" y="468" width="184" height="60" rx="14" />
  </g>
  <text class="name" x="762" y="416">Job boards</text>
  <text class="sub" x="762" y="437" style="font-size: 12px">Greenhouse · Lever · Ashby</text>
  <text class="name" x="762" y="492">OpenAI · Anthropic</text>
  <text class="sub" x="762" y="513">only on Parse resume</text>
</svg>
