<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" width="960" height="516" role="img" aria-labelledby="title desc">
  <title id="title">Outbox architecture</title>
  <desc id="desc">The web app and the Autofill extension talk to one Cloudflare Worker, which serves the app, runs a Hono API with Better Auth, and stores data in D1. The extension asks Claude only for fields its rules can't place. In development, the web app also reaches a local NestJS service for Discover and Resume tools.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #8e8e93; }
    .title { font-size: 16px; font-weight: 600; fill: #1d1d1f; }
    .name { font-size: 14px; font-weight: 600; fill: #1d1d1f; }
    .sub { font-size: 12.5px; fill: #6e6e73; }
    .edge { font-size: 11px; fill: #8e8e93; }
    .card { fill: #ffffff; stroke: #e3e3e8; stroke-width: 1; }
    .wire { fill: none; stroke: #d6d6dc; stroke-width: 1.5; }
    .pulse {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 0.14 1.3;
      stroke-dashoffset: 0.14;
      opacity: 0;
      animation: travel 7s linear infinite;
    }
    .data { stroke: #0a7cff; }
    .ai { stroke: #d97757; }
    .local { stroke: #8e8e93; }
    .live { animation: breathe 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes travel {
      0% { stroke-dashoffset: 0.14; opacity: 1; }
      24% { stroke-dashoffset: -1; opacity: 1; }
      25%, 100% { stroke-dashoffset: -1; opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
      .live { animation: none; }
    }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="515" rx="16" fill="#ffffff" stroke="#ececf0" />

  <!-- The Worker's box goes under the wires, its cards over them -->
  <rect x="372" y="96" width="296" height="282" rx="18" fill="#fafafb" stroke="#e3e3e8" />

  <!-- Wires -->
  <path class="wire" d="M264,148 C330,148 326,165 392,165" />
  <path class="wire" d="M264,290 C330,290 326,185 392,185" />
  <path class="wire" d="M264,312 C330,312 326,247 392,247" />
  <path class="wire" d="M648,171 C700,171 692,250 744,250" />
  <path class="wire" d="M648,323 C700,323 692,276 744,276" />
  <path class="wire" stroke-dasharray="4 5" d="M148,96 C148,74 164,64 196,64 L700,64 C726,64 744,72 744,85" />
  <path class="wire" stroke-dasharray="4 5" d="M148,348 C148,404 164,446 200,446 L372,446" />

  <text class="edge" x="318" y="120" text-anchor="middle">logs · profile</text>
  <text class="edge" x="318" y="134" text-anchor="middle">resume PDFs</text>
  <text class="edge" x="322" y="346" text-anchor="middle">same origin</text>
  <text class="edge" x="698" y="196" text-anchor="middle">SQL</text>
  <text class="edge" x="702" y="342" text-anchor="middle">sessions</text>
  <text class="edge" x="452" y="54" text-anchor="middle">only fields the rules can't place · the owner's own key</text>
  <text class="edge" x="278" y="436" text-anchor="middle">/local-tools · dev server</text>

  <!-- Pulses: a log from the extension lands in D1 and comes back to the app's list; the extension asks Claude; the
       app asks the local service -->
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M264,148 C330,148 326,165 392,165" style="animation-delay: 0s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M648,171 C700,171 692,250 744,250" style="animation-delay: 1.2s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M744,250 C692,250 700,171 648,171" style="animation-delay: 2.6s" />
  <path class="pulse data" pathLength="1" filter="url(#glow)" d="M392,185 C326,185 330,290 264,290" style="animation-delay: 3.6s" />
  <path class="pulse ai" pathLength="1" filter="url(#glow)" d="M148,96 C148,74 164,64 196,64 L700,64 C726,64 744,72 744,85" style="animation-delay: 4.6s" />
  <path class="pulse local" pathLength="1" filter="url(#glow)" d="M148,348 C148,404 164,446 200,446 L372,446" style="animation-delay: 5.6s" />

  <!-- Clients -->
  <g filter="url(#lift)">
    <rect class="card" x="32" y="96" width="232" height="104" rx="14" />
    <rect class="card" x="32" y="256" width="232" height="92" rx="14" />
  </g>
  <text class="eyebrow" x="52" y="122">CHROME</text>
  <text class="title" x="52" y="146">Autofill extension</text>
  <text class="sub" x="52" y="170">MV3 · WXT · 9 ATS adapters</text>
  <text class="sub" x="52" y="188">Rules first, Claude for the rest</text>

  <text class="eyebrow" x="52" y="282">BROWSER</text>
  <text class="title" x="52" y="306">Outbox web app</text>
  <text class="sub" x="52" y="330">React 19 · TanStack Query</text>
  <g transform="translate(222 272) scale(0.36)" fill="#1d1d1f">
    <rect x="8" y="18" width="33.5" height="7" rx="3.5" />
    <rect x="22" y="28.5" width="27" height="7" rx="3.5" />
    <rect x="34.3" y="39" width="21.7" height="7" rx="3.5" />
  </g>

  <!-- The Worker -->
  <circle class="live" cx="394" cy="118" r="4.5" fill="#f38020" />
  <text class="name" x="406" y="123">Cloudflare Worker</text>
  <text class="edge" x="648" y="123" text-anchor="end">one deploy</text>
  <g filter="url(#lift)">
    <rect class="card" x="392" y="140" width="256" height="62" rx="12" />
    <rect class="card" x="392" y="216" width="256" height="62" rx="12" />
    <rect class="card" x="392" y="292" width="256" height="62" rx="12" />
  </g>
  <text class="name" x="410" y="166">Hono API · /api</text>
  <text class="sub" x="410" y="186">zod-validated, scoped to the owner</text>
  <text class="name" x="410" y="242">Static assets</text>
  <text class="sub" x="410" y="262">the built React app</text>
  <text class="name" x="410" y="318">Better Auth</text>
  <text class="sub" x="410" y="338">Google sign-in, allowlisted emails</text>

  <!-- Storage -->
  <g filter="url(#lift)">
    <path d="M744,212 V312 A92,13 0 0 0 928,312 V212" fill="#ffffff" stroke="#e3e3e8" />
    <ellipse cx="836" cy="212" rx="92" ry="13" fill="#fafafb" stroke="#e3e3e8" />
  </g>
  <text class="name" x="836" y="266" text-anchor="middle">D1 · SQLite</text>
  <text class="sub" x="836" y="286" text-anchor="middle">Drizzle, batched writes</text>

  <!-- AI -->
  <rect class="card" x="744" y="50" width="184" height="70" rx="14" filter="url(#lift)" />
  <circle cx="764" cy="75" r="4.5" fill="#d97757" />
  <text class="name" x="776" y="80">Claude API</text>
  <text class="sub" x="764" y="103">from the extension only</text>

  <!-- The local service, in development only -->
  <rect x="372" y="406" width="296" height="84" rx="14" fill="#fafafb" stroke="#cfcfd6" stroke-dasharray="4 4" />
  <text class="name" x="392" y="433">Local service · backend/</text>
  <text class="edge" x="648" y="433" text-anchor="end">dev only</text>
  <text class="sub" x="392" y="455">Discover and Resume tools</text>
  <text class="sub" x="392" y="474">NestJS · Prisma · PostgreSQL</text>
</svg>
