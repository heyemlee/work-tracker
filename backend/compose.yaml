name: outbox-lab
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U outbox -d outbox']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
